# TEMPORARY Rust reference dumper for the C17 rewrite (REWRITE_PLAN.md B4). Not part of the
# workspace. Run: cargo run --offline --release --manifest-path tools/rustref/Cargo.toml
# Subcommands: see src/main.rs. `vectors` prints what tests/base/test_{half,json,base64}.c check.
# base64 0.22.1 matches the workspace lock; fetch it with `cargo fetch` if offline fails.
[package]
name = "rustref"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "=1.0.149"
half = "=2.7.1"
base64 = "=0.22.1"
blake3 = "1"
photocraft-geom = { path = "../../crates/geom" }
photocraft-cms = { path = "../../crates/cms" }
photocraft-color = { path = "../../crates/color" }
photocraft-raster = { path = "../../crates/raster" }
photocraft-psd = { path = "../../crates/psd", features = ["testgen"] }
photocraft-codecs = { path = "../../crates/codecs" }
photocraft-io = { path = "../../crates/io" }
photocraft-compose = { path = "../../crates/compose" }
photocraft-raw = { path = "../../crates/raw", features = ["testgen"] }
photocraft-affinity = { path = "../../crates/affinity" }
photocraft-doc = { path = "../../crates/doc" }
photocraft-ops = { path = "../../crates/ops" }
photocraft-paint = { path = "../../crates/paint" }
photocraft-algo = { path = "../../crates/algo" }
photocraft-vector = { path = "../../crates/vector" }
photocraft-text = { path = "../../crates/text" }
photocraft-format = { path = "../../crates/format" }

[workspace]
